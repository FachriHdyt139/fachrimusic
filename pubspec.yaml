name: fachrimusic
description: "FachriMusic - pemutar musik offline bergaya hacker."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Pemutar audio (play/pause/seek file MP3 lokal)
  audioplayers: ^6.1.0
  # Memindai semua lagu di memori HP (MediaStore)
  on_audio_query: ^2.9.0
  # Minta izin akses file musik ke Android
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Membuat icon aplikasi otomatis dari gambar kita
  flutter_launcher_icons: ^0.13.1

# ====== Konfigurasi icon aplikasi ======
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

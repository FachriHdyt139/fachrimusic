name: Build APK FachriMusic

# Kapan pabrik jalan? Setiap kamu push ke branch 'main',
# atau ditekan manual dari tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Pasang Flutter (mesin pabrik)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate struktur project Android
        run: flutter create --org com.fachri --project-name fachrimusic --platforms android .

      - name: Pastikan label & izin aplikasi benar
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="FachriMusic"/' "$MF"
          if ! grep -q 'android.permission.READ_MEDIA_AUDIO' "$MF"; then
            sed -i 's|    <application|    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application|' "$MF"
          fi
          echo "=== Hasil manifest ==="
          grep -E 'android:label|uses-permission' "$MF"

      - name: Unduh semua paket (dependencies)
        run: flutter pub get

      - name: Perbaiki plugin Android lama (namespace + JVM target serasi)
        run: |
          SRC=$(ls -d $HOME/.pub-cache/hosted/pub.dev/on_audio_query_android-*/ 2>/dev/null | head -1)
          echo "Plugin: ${SRC}"
          if [ -f "${SRC}android/build.gradle" ]; then
            cat > "${SRC}android/build.gradle" << 'GRADLE'
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.lucasjosino.on_audio_query'
    compileSdk 34
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 21
    }
}

dependencies {
    def lifecycle_version = '2.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
}
GRADLE
            echo "--- build.gradle plugin ditulis ulang ---"
            grep -E 'namespace|jvmTarget|compileSdk|VERSION_17' "${SRC}android/build.gradle"
          else
            echo "!! build.gradle plugin tidak ditemukan"
            exit 1
          fi

      - name: Buat icon aplikasi (logo kita)
        run: dart run flutter_launcher_icons

      - name: Rakit APK release
        run: flutter build apk --release

      - name: Unggah hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: fachrimusic-apk
          path: build/app/outputs/flutter-apk/app-release.apk
